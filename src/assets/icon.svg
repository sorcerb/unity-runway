<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="220" fill="url(#glow)"/>

  <!-- A solid cube seen corner-on -->
  <g stroke-linejoin="round" stroke-width="10">
    <polygon points="256,66 425.7,164 256,262 86.3,164" fill="url(#top)" stroke="#a5f3fc"/>
    <polygon points="86.3,164 256,262 256,458 86.3,360" fill="url(#left)" stroke="#0e9fc4"/>
    <polygon points="256,262 425.7,164 425.7,360 256,458" fill="url(#right)" stroke="#1d4ed8"/>
  </g>

  <!-- The edges between the faces are cut as dashed runway markings, running out from the near corner -->
  <g stroke="#0b1120" stroke-width="20" stroke-dasharray="34 18" fill="none">
    <line x1="256" y1="262" x2="86.3" y2="164"/>
    <line x1="256" y1="262" x2="425.7" y2="164"/>
    <line x1="256" y1="262" x2="256" y2="458"/>
  </g>
  <circle cx="256" cy="262" r="16" fill="#0b1120"/>
</svg>
